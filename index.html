<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allê Ebrahim VENDAS | Hazelink</title>
    <meta
      name="description"
      content="Hazelink profissional de Allê Ebrahim VENDAS, especialista em treinamentos de atendimento e vendas."
    />
    <meta name="theme-color" content="#0b0a08" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="hazelink" aria-label="Hazelink profissional de Allê Ebrahim">
      <div class="background" aria-hidden="true"></div>
      <div class="shade" aria-hidden="true"></div>

      <section class="hero" aria-labelledby="page-title">
        <div class="portrait-shell">
          <img
            class="portrait"
            src="assets/alle-ebrahim.png"
            alt="Foto de Allê Ebrahim sorrindo"
          />
        </div>

        <h1 id="page-title">Allê Ebrahim</h1>
        <p class="role">Consultora de vendas</p>
        <p class="subtitle">Treinamento em Vendas e Experiência do Cliente</p>

        <a class="agenda-pill" href="#" data-label="Agenda 2026">
          <span class="pill-icon" data-icon="calendar"></span>
          <span>Agenda 2026 disponível</span>
        </a>
      </section>

      <section class="pillars" aria-label="Áreas de atuação" data-pillars></section>

      <section class="actions" aria-label="Links principais">
        <div class="link-list" data-links></div>
      </section>

      <footer class="footer">
        <p>Gente que vende e transforma</p>
      </footer>
    </main>

    <div class="toast" role="status" aria-live="polite" data-toast></div>
    <script src="js/script.js"></script>
  </body>
</html>
